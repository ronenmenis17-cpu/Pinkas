<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פנקס הכסף</title>
<meta name="theme-color" content="#0e6470">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="פנקס הכסף">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: a personal ledger. Sticky header with the month stepper, one column of sections,
   figure tiles in an auto-fit grid; tabs sit in the header on desktop and at the bottom on phones. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e8eeec; --ink:#13282a; --ink-2:#465b5d; --muted:#6f8384;
  --line:#d6e0de; --line-2:#c2cfcd; --accent:#0e6470; --accent-ink:#ffffff; --accent-soft:#dbebed;
  --good:#1b7643; --good-soft:#dcf0e3; --warn:#9a6200; --warn-soft:#f9eed6; --crit:#bf342d; --crit-soft:#f8e0de;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 1px 2px rgba(19,40,42,.06), 0 8px 24px -12px rgba(19,40,42,.18);
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-body:"IBM Plex Sans Hebrew","Assistant","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1516; --surface:#152022; --sunk:#1b292b; --ink:#e2eded; --ink-2:#b0c2c2; --muted:#83999a;
  --line:#253537; --line-2:#33484a; --accent:#5ab7c3; --accent-ink:#04262a; --accent-soft:#1a3639;
  --good:#45c178; --good-soft:#163526; --warn:#e7a83d; --warn-soft:#3a2d12; --crit:#f06c63; --crit-soft:#41201d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1516; --surface:#152022; --sunk:#1b292b; --ink:#e2eded; --ink-2:#b0c2c2; --muted:#83999a;
  --line:#253537; --line-2:#33484a; --accent:#5ab7c3; --accent-ink:#04262a; --accent-soft:#1a3639;
  --good:#45c178; --good-soft:#163526; --warn:#e7a83d; --warn-soft:#3a2d12; --crit:#f06c63; --crit-soft:#41201d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body.out .tabs, body.out .month, body.out .top [data-act="addTxn"]{display:none}
.login{max-width:400px;margin:6vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login .brand-mark{width:60px;height:60px;border-radius:16px;font-size:1.9rem}
.login h1{font-family:var(--f-display);font-size:1.9rem}
.login p{color:var(--ink-2);margin:0}
.login form{display:flex;flex-direction:column;gap:12px}
.login .btn{justify-content:center;padding:10px 16px;font-size:.95rem}
.login .err{color:var(--crit);font-size:.88rem;min-height:1.2em}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.offline-dot{font-size:.75rem;color:var(--muted);white-space:nowrap}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.005em}
h3{font-size:.95rem;font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.95rem}
.month{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:30px;height:30px;border-radius:999px;cursor:pointer;font-size:1.05rem;color:var(--ink-2)}
.month button:hover{background:var(--surface)}
.month span{min-width:112px;text-align:center;font-weight:600;font-size:.92rem}
.spacer{flex:1}
.tabs{display:flex;gap:2px}
.tabs a{text-decoration:none;color:var(--ink-2);padding:7px 11px;border-radius:8px;font-weight:500;font-size:.92rem;white-space:nowrap}
.tabs a:hover{background:var(--sunk)}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs .ico{display:none}

main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}

@media (max-width:760px){
  .top-in{gap:8px}
  .top .tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 4px;font-size:.72rem;flex:1;min-width:0}
  .tabs .ico{display:block;font-size:1.05rem;line-height:1.1}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .brand-name{display:none}
  .month span{min-width:96px}
}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* sections */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .actions{margin-inline-start:auto}
.sec-h .note{color:var(--muted);font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;box-shadow:var(--shadow)}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.eyebrow{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:500}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,7vw,3.1rem);line-height:1.1;letter-spacing:-.01em}
.big.neg{color:var(--crit)}
.sub{color:var(--ink-2);font-size:.92rem;display:flex;gap:4px 14px;flex-wrap:wrap}
.hero-plan{display:flex;flex-direction:column;justify-content:center;gap:8px}
.meter{height:12px;border-radius:999px;background:var(--sunk);overflow:hidden}
.meter-fill{height:100%;background:var(--accent);border-radius:999px}
.meter-fill.over{background:var(--crit)}
.meter-lab{font-size:.88rem;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:.8rem;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.25}
.tile .h{font-size:.78rem;color:var(--muted)}
.tile .v.good{color:var(--good)} .tile .v.crit{color:var(--crit)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));flex:none;display:inline-block}

/* budget vs actual */
.bva{display:flex;flex-direction:column;gap:12px}
.bva-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem}
.bva-head b{font-weight:600}
.bva-head .vals{margin-inline-start:auto;color:var(--ink-2);font-size:.85rem}
.track{position:relative;height:16px;margin-top:4px}
.track .plan{position:absolute;inset-block:0;inset-inline-start:0;border:1.5px dashed var(--line-2);border-radius:4px}
.track .act{position:absolute;inset-block:3px;inset-inline-start:0;background:var(--c);border-radius:0 4px 4px 0;min-width:2px}
.track .act.over{background:repeating-linear-gradient(135deg,var(--c) 0 6px,color-mix(in srgb,var(--c) 70%,var(--surface)) 6px 9px)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:5px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;width:100%;cursor:pointer;min-width:0}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.row .a{grid-row:1 / span 2;grid-column:2;text-align:end;display:flex;flex-direction:column;align-items:flex-end}
.row .a b{font-weight:600}
.row .a small{color:var(--muted);font-size:.76rem}
.row.addrow{display:block;color:var(--accent);font-weight:500;font-size:.88rem;padding-block:9px}
.group-h{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--sunk);font-size:.82rem;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line)}
.group-h .num{margin-inline-start:auto}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{font-family:var(--f-display);font-size:1.1rem;color:var(--ink)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.78rem;background:var(--sunk)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--sunk)}
td select,td input{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:.85rem;max-width:170px}
tr.dup td{opacity:.55}
tr.uncat td.cat select{border-color:var(--warn)}

/* stacked composition bar */
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.stack div{background:var(--c);min-width:3px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field .hint{font-size:.75rem;color:var(--muted)}
.field input[type=checkbox]{width:auto}
.field label.check{font-weight:500;font-size:.88rem;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input,.inline select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 9px}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,20,22,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);margin-top:4vh}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h .x{margin-inline-start:auto}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.sheet .foot .grow{flex:1}
.bal-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.bal-row input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;text-align:end}
.bal-row small{display:block;color:var(--muted);font-size:.75rem}

.banner{border-radius:var(--r);padding:10px 14px;font-size:.9rem;background:var(--warn-soft);color:var(--warn);display:flex;gap:8px;align-items:center}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;z-index:30;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.chart-box{position:relative;height:260px}
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats .chip{font-size:.82rem;padding:3px 6px 3px 10px}
.cats .chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 2px;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.row,.btn,.tabs a{transition:background-color .12s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="brand-mark" aria-hidden="true">₪</span><span class="brand-name">פנקס הכסף</span></div>
  <div class="month" aria-label="בחירת חודש">
    <button type="button" data-act="month" data-d="-1" aria-label="חודש קודם">›</button>
    <span id="monthLabel"></span>
    <button type="button" data-act="month" data-d="1" aria-label="חודש הבא">‹</button>
  </div>
  <div class="spacer"></div>
  <span class="offline-dot" id="netState" hidden>● בלי אינטרנט</span>
  <nav class="tabs" id="tabs">
    <a href="#overview" data-v="overview"><span class="ico" aria-hidden="true">◉</span>סקירה</a>
    <a href="#budget" data-v="budget"><span class="ico" aria-hidden="true">☰</span>תקציב</a>
    <a href="#txns" data-v="txns"><span class="ico" aria-hidden="true">⇅</span>תנועות</a>
    <a href="#invest" data-v="invest"><span class="ico" aria-hidden="true">◧</span>השקעות</a>
    <a href="#history" data-v="history"><span class="ico" aria-hidden="true">↗</span>היסטוריה</a>
    <a href="#prefs" data-v="prefs"><span class="ico" aria-hidden="true">⚙</span>הגדרות</a>
  </nav>
  <button type="button" class="btn primary" data-act="addTxn">+ הוצאה</button>
</div></header>
<main id="view" dir="rtl"></main>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden><div></div></div>
<input type="file" id="fileImport" accept=".xlsx,.xls,.csv,.pdf,application/pdf" hidden>
<input type="file" id="fileBackup" accept=".json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- constants & helpers ---------- */
const KINDS = {regular:'שוטפת', exceptional:'חריגה', fixed:'קבועה (כבר נספרת)'};
const MANUAL_KINDS = [['regular', 'שוטפת'], ['exceptional', 'חריגה']];
const METHODS = {card:'אשראי', transfer:'העברה / הו"ק'};
const INST = {
  banks: ['בנק הפועלים', 'בנק לאומי', 'בנק דיסקונט', 'בנק מזרחי טפחות', 'הבנק הבינלאומי', 'בנק מרכנתיל', 'בנק ירושלים', 'בנק יהב', 'בנק מסד', 'וואן זירו (ONE ZERO)', 'בנק הדואר'],
  gemel: ['אלטשולר שחם', 'מור', 'מיטב', 'הראל', 'מגדל', 'כלל', 'הפניקס', 'מנורה מבטחים', 'אנליסט', 'ילין לפידות', 'אינפיניטי', 'הכשרה'],
  pension: ['מגדל', 'הראל', 'כלל', 'הפניקס', 'מנורה מבטחים', 'מיטב', 'אלטשולר שחם', 'מור', 'אינפיניטי', 'הכשרה', 'עמיתים (קרנות ותיקות)'],

const STORE_KEY = 'pinkas-db-v1';
function localDb() {

    catch (e) { toast('האחסון בטלפון מלא. גבה ומחק תנועות ישנות.'); throw {code: 'quota_exceeded'}; }
    setTimeout(() => subs.forEach(f => f()), 0);

  const parentOf = k => k.slice(0, k.lastIndexOf('/'));
  const docsOf = (col, filters) => Object.keys(data).filter(k => parentOf(k) === col).sort()
    .filter(k => filters.every(([f, op, v]) => op === '==' ? data[k][f] === v : op === 'in' ? v.includes(data[k][f]) : true)).map(snap);
  const qsnap = docs => ({docs, size: docs.length, empty: !docs.length, metadata: meta});

    get: async () => snap(path),

    update: async d => { if (!(path in data)) throw {code: 'invalid_argument'}; data[path] = {...data[path], ...clone(d)}; save(); },
    delete: async () => { delete data[path]; save(); },

    get: async () => qsnap(docsOf(col, filters)),
    onSnapshot: next => { const f = () => next(qsnap(docsOf(col, filters))); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    doc: id => docRef(col + '/' + (id || newId(col)))});

  'auth/email-already-in-use': 'כבר יש חשבון עם המייל הזה. נסה להיכנס.', 'auth/weak-password': 'הסיסמה קצרה מדי (לפחות 6 תווים).', 'auth/invalid-email': 'כתובת המייל לא תקינה.',
  'auth/network-request-failed': 'אין חיבור לאינטרנט. בפעם הראשונה צריך חיבור כדי להיכנס.', 'auth/too-many-requests': 'יותר מדי ניסיונות. חכה כמה דקות ונסה שוב.',
  'auth/operation-not-allowed': 'כניסה עם מייל וסיסמה לא הופעלה ב-Firebase (Authentication ← Email/Password).',
};
const authErr = (e) => { const el = $('#authErr'); if (el) el.textContent = AUTH_ERR[e?.code] || ('משהו השתבש (' + (e?.code || e?.message || 'שגיאה') + ')'); };
async function localHasData() {
  try { const d = JSON.parse(localStorage.getItem('pinkas-db-v1') || '{}'); return Object.keys(d).length; } catch { return 0; }
}
function lastBackup() { try { return Number(localStorage.getItem('pinkas-last-backup')) || 0; } catch { return 0; } }
function banners() {
  const empty = BASE.every(n => S.loaded.has(n)) && !S.settings && !S.budget.length && !S.accounts.length;
  let localCount = 0; try { localCount = S.mode === 'cloud' && !localStorage.getItem('pinkas-migrated') ? Object.keys(JSON.parse(localStorage.getItem('pinkas-db-v1') || '{}')).length : 0; } catch {}
  if (S.mode === 'cloud' && localCount)
    return `<div class="banner info" style="flex-wrap:wrap">ⓘ בטלפון הזה שמורים ${localCount} פריטים מלפני החיבור לענן.${empty ? '' : ' רשומות עם אותו מזהה יוחלפו.'}
      <span class="actions" style="margin-inline-start:auto"><button class="btn sm primary" data-act="migrateLocal">העברה לענן</button><button class="btn sm" data-act="skipMigrate">לא עכשיו</button></span></div>`;
  if (empty)
    return `<div class="banner info" style="flex-wrap:wrap">ⓘ ברוך הבא! כדי להעביר את הנתונים מהגרסה ב-claude.ai: שם, בהגדרות, לוחצים "גיבוי מלא (JSON)", ואז כאן בוחרים את הקובץ.
      <button class="btn sm primary" data-act="pickBackup" style="margin-inline-start:auto">שחזור מגיבוי</button></div>`;
  const lb = lastBackup(), days = lb ? Math.floor((Date.now() - lb) / 864e5) : null;
  if (S.mode !== 'cloud' && S.view === 'overview' && (S.budget.length || S.txns.length) && (days === null || days >= 30))
    return `<div class="banner" style="flex-wrap:wrap">⚠ הנתונים שמורים רק בטלפון הזה. ${days === null ? 'עוד לא עשית גיבוי.' : `הגיבוי האחרון לפני ${days} ימים.`}
      <button class="btn sm" data-act="exportJson" style="margin-inline-start:auto">גיבוי עכשיו</button></div>`;
  if (S.err) return `<div class="banner">⚠ החיבור לנתונים נקטע (${esc(S.err)}). רענן את הדף כדי להתחבר מחדש.</div>`;
  if (S.stale) return `<div class="banner">⚠ עדיין לא הצלחתי להגיע לנתונים. מה שמוצג אולי לא מעודכן.</div>`;
  return '';
}
const loadingBase = () => !S.noDb && !S.err && BASE.some(n => !S.loaded.has(n));
const statusChip = (cls, label, icon) => `<span class="chip ${cls}">${icon || (cls === 'crit' ? '▲' : cls === 'warn' ? '!' : cls === 'good' ? '✓' : '')} ${esc(label)}</span>`;
const tile = (k, v, h, cls = '') => `<div class="tile"><span class="k">${k}</span><span class="v ${cls}">${v}</span>${h ? `<span class="h">${h}</span>` : ''}</div>`;
const kindChip = k => k === 'exceptional' ? statusChip('warn', 'חריגה', '▲') : k === 'fixed' ? `<span class="chip acc">קבועה · לא נספרת שוב</span>` : '';
function catChip(c) { return `<span class="chip"><span class="sw" style="--c:${catColor(c)}"></span>${esc(c || 'ללא קטגוריה')}</span>`; }
function emptyBox(title, text, btn) { return `<div class="empty"><b>${title}</b><span>${text}</span>${btn || ''}</div>`; }
function loadingBox() { return `<div class="empty"><b>טוען את הנתונים…</b><span>רגע, מתחבר לפנקס שלך.</span></div>`; }

VIEWS.overview = {html() {

      <div class="big ${left < 0 ? 'neg' : ''}">${M(left)}</div>
      <div class="sub"><span>הכנסה ${M(inc)}</span><span>הוצאה בפועל ${M(A.total)}</span><span>חיסכון ${P(rate)}</span></div>
      <div class="sub"><span>קבועות ${M(A.fixed)} (אוטומטי)</span><span>משתנות ונוספות ${M(A.varTx)}</span></div>

    <div class="hero-plan">
      <div class="eyebrow">ניצול התקציב החודשי</div>

      <div class="meter-lab"><span>${M(A.total)} מתוך ${M(pl.expense)} (${P(prog)})</span>
        ${prog > 1 ? statusChip('crit', 'חריגה של ' + money(A.total - pl.expense)) : A.excTotal ? statusChip('warn', 'חריגות ' + money(A.excTotal), '▲') : ''}</div>
      <div class="meter-lab">${isCur ? 'צפי לסוף החודש' : 'סיכום החודש'}: הוצאה ${M(A.forecast)} · נשאר ${M(inc - A.forecast)}</div>
    </div>
  </section>

  ${variableHtml()}

  <section class="sec">
    <div class="sec-h"><h2>התוכנית החודשית</h2><span class="note">לפי ההוצאות הקבועות וההכנסה הקבועה</span></div>
    <div class="tiles">
      ${tile('הכנסה חודשית נטו', M(pl.income))}
      ${tile('הוצאה חודשית נטו', M(pl.expense), `שנתי ${money(pl.expense * 12)}`)}
      ${tile('רווח חודשי', M(pl.profit), '', pl.profit >= 0 ? 'good' : 'crit')}
      ${tile('אחוז חיסכון', P(pl.rate))}
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>תקציב מול ביצוע</h2><span class="note">${monthLabel(S.month)}</span>
      <div class="actions"><a class="btn ghost sm" href="#txns">לכל התנועות ←</a></div></div>
    <div class="panel">${bvaHtml(pl, A)}</div>
  </section>

  <div class="two">
    <section class="sec">
      <div class="sec-h"><h2>חריגות החודש</h2><span class="note">${M(A.excTotal)}</span></div>
      ${A.exc.length ? `<div class="list">${A.exc.map(txRow).join('')}</div>` : emptyBox('אין חריגות החודש', `הוצאה חד-פעמית שמסומנת "חריגה", או עסקה מעל ${money(cfg().threshold)} בייבוא, תופיע כאן.`)}
    </section>

      <div class="sec-h"><h2>תנועות אחרונות</h2></div>

function bvaHtml(pl, A) {
  const cats = allCats().filter(c => (pl.byCat[c] || 0) > 0 || (A.byCat[c] || 0) !== 0);
  if (!cats.length) return emptyBox('אין עדיין תקציב', 'הוסף הוצאות קבועות במסך התקציב.', `<a class="btn" href="#budget">למסך התקציב</a>`);
  const max = Math.max(1, ...cats.map(c => Math.max(pl.byCat[c] || 0, A.byCat[c] || 0)));
  const rows = cats.map(c => {
    const b = pl.byCat[c] || 0, a = A.byCat[c] || 0, over = a > b;
    const label = `${c}: ${money(a)} בפועל מתוך תקציב ${money(b)}`;
    return `<div class="bva-row" title="${esc(label)}">
      <div class="bva-head"><span class="sw" style="--c:${catColor(c)}"></span><b>${esc(c)}</b>
        ${over && b > 0 ? statusChip('crit', '+' + money(a - b)) : ''}${over && b === 0 ? `<span class="chip">ללא תקציב</span>` : ''}
        <span class="vals">${M(a)} / ${M(b)}</span></div>
      <div class="track" role="img" aria-label="${esc(label)}">
        ${b > 0 ? `<div class="plan" style="width:${b / max * 100}%"></div>` : ''}
        <div class="act ${over ? 'over' : ''}" style="--c:${catColor(c)};width:${Math.max(0, a) / max * 100}%"></div>
      </div></div>`;
  }).join('');
  return `<div class="bva">${rows}</div>
    <div class="legend" style="margin-top:14px"><span><i style="background:var(--s1)"></i>בפועל</span><span><i style="border:1.5px dashed var(--line-2)"></i>תקציב</span><span><i style="background:repeating-linear-gradient(135deg,var(--s1) 0 6px,color-mix(in srgb,var(--s1) 70%,var(--surface)) 6px 9px)"></i>מעל התקציב</span></div>`;
}

function variableHtml() {
  const items = S.budget.filter(isVar);
  if (!items.length) return '';
  const rows = items.map(b => {
    const plan = cost(b), act = itemActual(b), over = act > plan;
    return `<div class="bva-row" title="${esc(b.name)}: ${money(act)} מתוך ${money(plan)}">
      <div class="bva-head"><span class="sw" style="--c:${catColor(b.category)}"></span><b>${esc(b.name)}</b>
        ${over ? statusChip('crit', '+' + money(act - plan)) : ''}
        <span class="vals">${M(act)} / ${M(plan)}</span>
        <button class="btn sm" data-act="addVarTxn" data-id="${esc(b.id)}">+ רישום</button></div>
      <div class="track"><div class="plan" style="width:100%"></div><div class="act ${over ? 'over' : ''}" style="--c:${catColor(b.category)};width:${Math.min(100, plan ? act / plan * 100 : 0)}%"></div></div></div>`;
  }).join('');
  return `<section class="sec"><div class="sec-h"><h2>הוצאות משתנות</h2><span class="note">רושמים את מה שיצא בפועל</span></div>
    <div class="panel"><div class="bva">${rows}</div></div></section>`;
}
function compositionHtml(W) {
  const c = cfg();
  const types = Object.keys(W.byType).filter(t => W.byType[t] > 0).sort((a, b) => c.types.indexOf(a) - c.types.indexOf(b));
  const bar = types.map(t => `<div style="--c:${typeColor(t)};flex:${W.byType[t]}" title="${esc(t)}: ${money(W.byType[t])} (${pctT(W.byType[t] / W.total)})"></div>`).join('');
  const leg = types.map(t => `<span><i style="background:${typeColor(t)}"></i>${esc(t)} · ${M(W.byType[t])} · ${P(W.byType[t] / W.total)}</span>`).join('');
  return `<h3 style="margin-bottom:8px">איפה הכסף מושקע</h3><div class="stack" role="img" aria-label="התפלגות ההון לפי סוג">${bar}</div><div class="legend" style="margin-top:10px">${leg}</div>`;
}

function txRow(t) {
  const share = t.share ?? 1;
  return `<button class="row" data-act="editTxn" data-id="${esc(t.id)}">
    <span class="t">${esc(t.desc || 'הוצאה')}</span>
    <span class="a"><b>${M(eff(t), true)}</b>${share !== 1 ? `<small>מתוך ${money(t.amount, true)} · ${Math.round(share * 100)}%</small>` : ''}</span>
    <span class="m">${t.date ? `<span>${esc(dayLabel(t.date))}</span>` : ''}${catChip(t.category)}${kindChip(t.kind)}${t.source === 'import' ? '<span>ייבוא</span>' : ''}${t.note ? `<span>· ${esc(t.note)}</span>` : ''}</span>
  </button>`;
}

/* --- budget --- */

    <div class="track"><div class="act" style="--c:${catColor(c)};width:${pl.byCat[c] / max * 100}%;inset-block:2px"></div></div></div>`).join('')}</div>`;
}

    const btn = document.querySelector('[data-act="saveImport"]'); if (btn) btn.textContent = `שומר ${I.done}/${sel.length}…`;
  }
  if (I.learn) {
    const learned = new Map();
    for (const r of sel) if (r.category && r.nm && (!r.ruled || r.category !== r.sugg.category || r.share !== r.sugg.share)) learned.set(r.nm, r);
    for (const [nm, r] of learned) {
      try { await withRetry(() => S.db.doc('rules/r-' + h64(nm)).set({pattern: nm, label: r.desc, category: r.category, share: r.share, kind: r.kind === 'fixed' ? 'fixed' : 'regular', updatedAt: Date.now()})); } catch (e) { console.error(e); }
    }
  }
  S.imp = null; render();
  toast(failed ? `יובאו ${sel.length - failed} תנועות, ${failed} נכשלו. ייבא שוב את אותו קובץ כדי להשלים.` : `יובאו ${sel.length} תנועות`);
}

/* ---------- modal forms ---------- */
let formState = null;
function openForm({title, fields, values = {}, onSave, onDelete, saveLabel = 'שמירה', extra = ''}) {
  formState = {fields, onSave, onDelete, confirmDel: false};
  const f = fields.map(fd => {
    const v = values[fd.k] ?? fd.def ?? '';
    const id = 'f_' + fd.k;
    let input;
    if (fd.type === 'pick') { const o = pickOptions(fd.k, values.type, v); input = `<select id="${id}_sel" data-ch="pickSel" data-k="${fd.k}" aria-label="${esc(fd.label)}">${o.html}</select><input id="${id}" name="${fd.k}" value="${esc(v)}" placeholder="${esc(fd.ph || '')}" ${o.other ? '' : 'hidden'}>`; }
    else if (fd.type === 'select') input = `<select id="${id}" name="${fd.k}" ${fd.ch ? `data-ch="${fd.ch}"` : ''}>${fd.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (fd.type === 'pct') input = `<input id="${id}" name="${fd.k}" type="number" inputmode="decimal" min="0" max="100" step="any" value="${esc(v === '' ? 100 : Math.round(v * 10000) / 100)}">`;
    else input = `<input id="${id}" name="${fd.k}" type="${fd.type || 'text'}" ${fd.type === 'number' ? 'inputmode="decimal" step="any"' : ''} value="${esc(v)}" ${fd.req ? 'required' : ''} ${fd.ph ? `placeholder="${esc(fd.ph)}"` : ''} ${fd.list ? `list="dl_${fd.k}"` : ''}>${fd.list ? `<datalist id="dl_${fd.k}">${fd.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
    return `<div class="field" ${fd.wide ? 'style="grid-column:1/-1"' : ''}><label for="${id}">${fd.label}</label>${input}${fd.hint ? `<span class="hint">${fd.hint}</span>` : ''}</div>`;
  }).join('');
  $('#modal').innerHTML = `<form class="sheet" id="mform" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <div class="sheet-h"><h2 id="mtitle">${title}</h2><button type="button" class="btn ghost sm x" data-act="closeModal" aria-label="סגירה">✕</button></div>
    <div class="fgrid">${f}</div>${extra}
    <div class="foot"><button class="btn primary" type="submit">${saveLabel}</button><button class="btn" type="button" data-act="closeModal">ביטול</button><span class="grow"></span>
      ${onDelete ? `<button class="btn danger" type="button" data-act="formDelete">מחיקה</button>` : ''}</div></form>`;
  $('#modal').hidden = false;
  setTimeout(() => $('#mform input:not([type=hidden]), #mform select')?.focus(), 30);
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; formState = null; if (pending) render(); }
function readForm() {
  const out = {};
  for (const fd of formState.fields) {
    const el = $('#f_' + fd.k); if (!el) continue;
    let v = el.value;
    if (fd.type === 'number') v = v === '' ? 0 : Number(v);
    if (fd.type === 'pct') v = v === '' ? 1 : Math.max(0, Math.min(100, Number(v))) / 100;
    if (typeof v === 'string') v = v.trim();
    out[fd.k] = v;
  }
  return out;
}

      ...(vars.length ? [{k: 'budgetId', label: 'שייך להוצאה משתנה', type: 'select', options: [['', 'לא (הוצאה נוספת)'], ...vars.map(b => [b.id, b.name])]}] : []),
      {k: 'kind', label: 'סוג', type: 'select', options: kinds, hint: 'חריגה = הוצאה חד-פעמית מחוץ לשגרה, כמו טיול או תיקון'},
      {k: 'share', label: 'החלק שלי (%)', type: 'pct', hint: 'למשל 50 אם ההוצאה משותפת'},
      {k: 'note', label: 'הערה', wide: true},
    ],
    onSave: async v => {
      if (!v.amount) { toast('הזן סכום'); return false; }
      const id = t?.id || newId('txns');
      const vb = v.budgetId ? S.budget.find(b => b.id === v.budgetId) : null;
      const doc = {...(t || {}), ...v, category: v.category || vb?.category || 'אחר', month: v.date.slice(0, 7), source: t?.source || 'manual', createdAt: t?.createdAt || Date.now()};
      delete doc.id;
      const ok = await put('txns/' + id, doc);
      if (ok) toast(doc.month !== S.month ? `נשמר ל${monthLabel(doc.month)}` : 'נשמר');
      return ok;
    },
    onDelete: t ? async () => { const ok = await del('txns/' + t.id); if (ok) toast('התנועה נמחקה'); return ok; } : null});
}
function budgetForm(b) {
  openForm({title: b ? 'עריכת הוצאה קבועה' : 'הוצאה קבועה חדשה', values: b ? {...b, variable: isVar(b) ? 'yes' : 'no'} : {share: 1, variable: 'no', category: cfg().categories[0]},
    fields: [
      {k: 'name', label: 'הוצאה', req: true, wide: true},
      {k: 'amount', label: 'סכום מלא בחודש (₪)', type: 'number', req: true},
      {k: 'share', label: 'החלק שלי (%)', type: 'pct'},
      {k: 'category', label: 'קטגוריה', type: 'select', options: allCats()},
      {k: 'variable', label: 'סוג ההוצאה', type: 'select', options: [['no', 'קבועה: נספרת אוטומטית כל חודש'], ['yes', 'משתנה: רושמים את מה שיצא בפועל']], hint: 'בהוצאה משתנה הסכום משמש כתקציב לחודש'},
    ],
    onSave: async v => { const id = b?.id || newId('budget'); const doc = {...(b || {}), ...v, variable: v.variable === 'yes', order: b?.order ?? Date.now()}; delete doc.id; const ok = await put('budget/' + id, doc); if (ok) toast('נשמר'); return ok; },
    onDelete: b ? async () => del('budget/' + b.id) : null});
}
function accountForm(a, type) {
  const c = cfg();
  const like = type ? S.accounts.find(x => x.type === type) : null;
  openForm({title: a ? 'עריכת נכס' : 'נכס / חשבון חדש', values: a || {type: type || c.types[0], liquidity: like?.liquidity || c.liquidity[0], balance: 0, deposit: 0, fee: 0},
    fields: [
      {k: 'name', label: 'נכס / חשבון', req: true, wide: true},
      {k: 'type', label: 'סוג', type: 'select', ch: 'acctType', options: [...new Set([...c.types, a?.type].filter(Boolean))]},
      {k: 'liquidity', label: 'נזילות', type: 'select', options: c.liquidity},
      {k: 'institution', label: 'מוסד / בית השקעות', type: 'pick', ph: 'שם המוסד'},
      {k: 'track', label: 'מסלול השקעה', type: 'pick', ph: 'שם המסלול'},
      {k: 'balance', label: 'יתרה נוכחית (₪)', type: 'number'},
      {k: 'deposit', label: 'הפקדה חודשית (₪)', type: 'number'},
      {k: 'fee', label: 'דמי ניהול מצבירה (% בשנה)', type: 'number'},
    ],
    onSave: async v => {
      const id = a?.id || newId('accounts');
      const doc = {...(a || {}), ...v, order: a?.order ?? Date.now()};
      if (!a || a.balance !== v.balance) doc.updatedAt = new Date().toISOString();
      delete doc.id; const ok = await put('accounts/' + id, doc); if (ok) toast('נשמר'); return ok;
    },
    onDelete: a ? async () => del('accounts/' + a.id) : null});
}
function balancesForm() {
  if (!S.accounts.length) { toast('הוסף קודם נכס או חשבון'); location.hash = 'invest'; return; }
  const months = [0, -1, -2, -3].map(k => addMonth(ymOf(new Date()), k));
  const rows = S.accounts.map(a => `<div class="bal-row"><label for="bal_${esc(a.id)}">${esc(a.name)}<small>${esc(a.type || '')}${a.updatedAt ? ' · עודכן ' + esc(a.updatedAt.slice(0, 10)) : ''}</small></label>
    <input id="bal_${esc(a.id)}" data-acc="${esc(a.id)}" type="number" inputmode="decimal" step="any" value="${a.balance || 0}"></div>`).join('');
  openForm({title: 'עדכון יתרות חודשי', saveLabel: 'שמירה וצילום מצב',
    fields: [{k: 'month', label: 'לאיזה חודש הצילום', type: 'select', options: months.map(m => [m, monthLabel(m)]), hint: 'הצילום נשמר בהיסטוריה. צילום חוזר לאותו חודש מחליף את הקודם.'}],
    extra: `<div>${rows}</div>`,
    onSave: async v => {
      const now = new Date().toISOString(), c = cfg();
      const nb = Object.fromEntries([...document.querySelectorAll('[data-acc]')].map(i => [i.dataset.acc, Number(i.value) || 0]));
      for (const a of S.accounts) if ((a.balance || 0) !== nb[a.id]) { if (!await patch('accounts/' + a.id, {balance: nb[a.id], updatedAt: now})) return false; }
      const accs = S.accounts.map(a => ({id: a.id, name: a.name, type: a.type || 'אחר', liquidity: a.liquidity || c.liquidity[0], balance: nb[a.id] ?? (a.balance || 0)}));
      const agg = key => Object.entries(accs.reduce((m, a) => (m[a[key]] = (m[a[key]] || 0) + a.balance, m), {})).map(([name, value]) => ({name, value}));
      const ok = await put('snapshots/' + v.month, {month: v.month, date: now, total: sum(accs, a => a.balance), deposits: sum(S.accounts, a => a.deposit),
        byType: agg('type'), byLiq: agg('liquidity'), accounts: accs});
      if (ok) toast(`נשמר צילום מצב ל${monthLabel(v.month)}`);
      return ok;
    }});
}

/* ---------- actions ---------- */
const ACT = {
  authToggle: () => { S.authEmail = $('#authEmail')?.value || S.authEmail; S.authMode = S.authMode === 'signup' ? 'signin' : 'signup'; render(); },
  resetPass: async () => {
    const email = $('#authEmail')?.value.trim();
    if (!email) { authErr({message: 'כתוב קודם את המייל'}); $('#authErr').textContent = 'כתוב קודם את המייל ואז לחץ שוב.'; return; }
    try { await AUTH.sendPasswordResetEmail(email); toast('שלחנו מייל לאיפוס הסיסמה'); } catch (e) { authErr(e); }
  },
  checkVerified: async el => {
    el.disabled = true;
    try { const u = AUTH.currentUser; await u.reload(); await u.getIdToken(true); if (AUTH.currentUser.emailVerified) { startCloud(AUTH.currentUser); return; } $('#authErr').textContent = 'עוד לא אומת. לחץ על הקישור במייל (בדוק גם בספאם) ונסה שוב.'; }
    catch (e) { authErr(e); }
    el.disabled = false;
  },
  resendVerify: async () => { try { await AUTH.currentUser.sendEmailVerification(); toast('המייל נשלח שוב'); } catch (e) { authErr(e); } },
  signOut: () => { stopData(); S.authMode = 'signin'; AUTH?.signOut(); },
  skipMigrate: () => { try { localStorage.setItem('pinkas-migrated', 'skipped'); } catch {} render(); },
  migrateLocal: async el => {
    el.disabled = true; el.textContent = 'מעביר…';
    let d = {}; try { d = JSON.parse(localStorage.getItem('pinkas-db-v1') || '{}'); } catch {}
    const entries = Object.entries(d); let fail = 0;
    for (let i = 0; i < entries.length; i += 8) await Promise.all(entries.slice(i, i + 8).map(async ([p, v]) => { try { await withRetry(() => S.db.doc(p).set(v)); } catch { fail++; } }));
    if (!fail) { try { localStorage.setItem('pinkas-migrated', String(Date.now())); } catch {} }
    toast(fail ? `הועברו ${entries.length - fail} פריטים, ${fail} נכשלו. נסה שוב.` : `הועברו ${entries.length} פריטים לענן`);
    render();
  },
  month: el => { S.month = addMonth(S.month, Number(el.dataset.d)); subTxns(); if (S.imp?.step === 'preview') markDups().then(render); render(); },
  addTxn: () => txnForm(null),
  editTxn: el => { const t = S.txns.find(x => x.id === el.dataset.id); if (t) txnForm(t); },
  addBudget: () => budgetForm(null),
  editBudget: el => { const b = S.budget.find(x => x.id === el.dataset.id); if (b) budgetForm(b); },
  addAccount: el => accountForm(null, el.dataset.type),
  editAccount: el => { const a = S.accounts.find(x => x.id === el.dataset.id); if (a) accountForm(a); },
  balances: () => balancesForm(),
  editIncome: () => openForm({title: 'הכנסה חודשית נטו', values: {income: cfg().income}, fields: [{k: 'income', label: 'הכנסה חודשית נטו (₪)', type: 'number'}],
    onSave: async v => saveSettings({income: v.income})}),
  closeModal: () => closeModal(),
  formDelete: async el => {
    if (!formState.confirmDel) { formState.confirmDel = true; el.textContent = 'לחץ שוב למחיקה'; return; }
    el.disabled = true; if (await formState.onDelete()) closeModal(); else el.disabled = false;
  },
  addVarTxn: el => { const b = S.budget.find(x => x.id === el.dataset.id); if (b) txnForm(null, {desc: b.name, category: b.category, budgetId: b.id, share: b.share ?? 1}); },
  pickImport: () => { $('#fileImport').value = ''; $('#fileImport').click(); },
  cancelImport: () => { S.imp = null; render(); },
  applyMap: async () => {
    const I = S.imp, sh = I.sheets[I.map.sheet];
    const found = extractRows(sh.rows, I.map);
    if (!found.length) { toast('לא נמצאו שורות עם תאריך וסכום. בדוק את בחירת העמודות.'); return; }
    await buildPreview(found); render();
  },
  saveImport: () => saveImport(),
  delSnap: async el => {
    if (S.confirmSnap !== el.dataset.id) { S.confirmSnap = el.dataset.id; render(); return; }
    S.confirmSnap = null; await del('snapshots/' + el.dataset.id);
  },
  delRule: el => del('rules/' + el.dataset.id),
  delListItem: el => { const k = el.dataset.k, list = cfg()[k].slice(); list.splice(Number(el.dataset.i), 1); saveSettings({[k]: list}); },
  exportJson: () => exportJson(),
  exportXlsx: () => exportXlsx(),
  pickBackup: () => { $('#fileBackup').value = ''; $('#fileBackup').click(); },
  cancelRestore: () => { S.restore = null; render(); },
  doRestore: () => doRestore(),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (e.target === $('#modal')) return;
  e.preventDefault(); ACT[el.dataset.act]?.(el);
});
$('#modal').addEventListener('mousedown', e => { if (e.target === $('#modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'mform' && formState) {
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    const ok = await formState.onSave(readForm());
    if (ok !== false) closeModal(); else btn.disabled = false;
    return;
  }
  if (e.target.dataset.form === 'auth') {
    const email = e.target.email.value.trim(), pw = e.target.pw.value, btn = e.target.querySelector('button');
    S.authEmail = email; btn.disabled = true; $('#authErr').textContent = '';
    try {
      if (S.authMode === 'signup') { const cred = await AUTH.createUserWithEmailAndPassword(email, pw); await cred.user.sendEmailVerification(); }
      else await AUTH.signInWithEmailAndPassword(email, pw);
      S.authMode = 'signin';
    } catch (err) { authErr(err); btn.disabled = false; }
    return;
  }
  if (e.target.dataset.form === 'pdfPass' && S.imp?.step === 'pdfpass') {
    const {file, buf} = S.imp, pw = e.target.pw.value; return importPdf(file, buf, pw);
  }
  if (e.target.dataset.form === 'addListItem') {
    const k = e.target.dataset.k, v = e.target.v.value.trim(), list = cfg()[k].slice();
    if (v && !list.includes(v)) { list.push(v); await saveSettings({[k]: list}); }
  }
});
const CH = {
  pickSel: el => { const inp = $('#f_' + el.dataset.k); if (el.value === '__other') { inp.hidden = false; inp.value = ''; inp.focus(); } else { inp.hidden = true; inp.value = el.value; } },
  acctType: el => { for (const k of Object.keys(PICK)) { const sel = $(`#f_${k}_sel`), inp = $('#f_' + k); if (!sel) continue; const o = pickOptions(k, el.value, inp.value); sel.innerHTML = o.html; inp.hidden = !o.other; } },
  monthIncome: async el => { if (el.value === '') await del('income/' + S.month); else await put('income/' + S.month, {month: S.month, amount: Number(el.value)}); },
  fCat: el => { S.f.cat = el.value; render(); },
  fKind: el => { S.f.kind = el.value; render(); },
  pIncome: el => saveSettings({income: Number(el.value) || 0}).then(ok => ok && toast('נשמר')),
  pThreshold: el => saveSettings({threshold: Number(el.value) || 0}).then(ok => ok && toast('נשמר')),
  ruleCat: el => patch('rules/' + el.dataset.id, {category: el.value}),
  mapSheet: el => { S.imp.map.sheet = Number(el.value); render(); },
  mapHeader: el => { S.imp.map.header = Math.max(0, Number(el.value) - 1); render(); },
  mapCol: el => { S.imp.map[el.dataset.k] = Number(el.value); },
  impInc: el => { S.imp.rows[el.dataset.i].include = el.checked; render(); },
  impCat: el => {
    const r = S.imp.rows[el.dataset.i]; r.category = el.value; r.touched = true;
    for (const o of S.imp.rows) if (o !== r && o.nm === r.nm && !o.touched && !o.ruled) o.category = el.value;
    render();
  },
  impKind: el => { S.imp.rows[el.dataset.i].kind = el.value; },
  impShare: el => { S.imp.rows[el.dataset.i].share = Number(el.value); render(); },
  pdfMode: async el => { const I = S.imp; I.pdf.mode = el.value; await buildPreview(parsePdfLines(I.pdf.lines, el.value).rows); render(); },
  impMonth: async el => { S.imp.monthMode = el.value; await markDups(); render(); },
  impLearn: el => { S.imp.learn = el.checked; },
};
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleImportFile(f); });
$('#fileBackup').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data?.app !== 'pinkas') throw new Error('bad');
    const docs = [];
    if (data.settings) docs.push(['settings/main', data.settings]);
    for (const k of ['budget', 'accounts', 'snapshots', 'rules', 'income', 'txns']) for (const d of data[k] || []) if (d && d.id) { const {id, ...rest} = d; docs.push([`${k}/${id}`, rest]); }
    S.restore = {docs, count: docs.length}; if (S.view !== 'prefs') location.hash = 'prefs'; render();
  } catch { toast('הקובץ הזה לא נראה כמו גיבוי של הפנקס.'); }
});
document.addEventListener('dragover', e => { if (S.view === 'txns' && e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { if (S.view !== 'txns') return; const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); handleImportFile(f); } });

/* ---------- backup / export ---------- */
async function collectAll() {
  const g = async n => (await S.db.collection(n).get()).docs.map(d => ({id: d.id, ...d.data()}));
  const st = await S.db.doc('settings/main').get();
  return {app: 'pinkas', version: 1, exportedAt: new Date().toISOString(), settings: st.exists ? st.data() : null,
    budget: await g('budget'), accounts: await g('accounts'), snapshots: await g('snapshots'), rules: await g('rules'), income: await g('income'), txns: await g('txns')};
}
async function offer(filename, data) {
  const type = filename.endsWith('.json') ? 'application/json' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const file = new File([data], filename, {type});
  if (filename.endsWith('.json')) { try { localStorage.setItem('pinkas-last-backup', String(Date.now())); } catch {} }
  try { if (navigator.canShare?.({files: [file]})) { await navigator.share({files: [file], title: filename}); render(); return; } }
  catch (e) { if (e?.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); render();
}
async function exportJson() {
  if (!S.db) return toast('אין חיבור למאגר הנתונים');
  try { const all = await collectAll(); await offer(`pinkas-backup-${today()}.json`, JSON.stringify(all, null, 1)); } catch (e) { console.error(e); toast('הגיבוי נכשל'); }
}
async function exportXlsx() {
  if (!S.db || !window.XLSX) return toast('הייצוא לא זמין כרגע');
  try {
    const all = await collectAll(), wb = XLSX.utils.book_new();
    const add = (name, rows) => XLSX.utils.book_append_sheet(wb, Object.assign(XLSX.utils.json_to_sheet(rows), {'!views': [{RTL: true}]}), name);
    add('הוצאות קבועות', all.budget.map(b => ({'הוצאה': b.name, 'סכום מלא': b.amount, 'החלק שלי': b.share ?? 1, 'עלות': cost(b), 'קטגוריה': b.category, 'שנתי': cost(b) * 12, 'סוג': isVar(b) ? 'משתנה' : 'קבועה'})));
    add('תנועות', all.txns.sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(t => ({'תאריך': t.date, 'חודש': t.month, 'תיאור': t.desc, 'סכום מלא': t.amount, 'החלק שלי': t.share ?? 1, 'עלות': eff(t), 'קטגוריה': t.category, 'סוג': KINDS[t.kind] || '', 'מקור': t.source, 'הערה': t.note || ''})));
    add('השקעות וחסכונות', all.accounts.map(a => ({'נכס / חשבון': a.name, 'סוג': a.type, 'מוסד': a.institution || '', 'מסלול': a.track || '', 'יתרה נוכחית': a.balance || 0, 'הפקדה חודשית': a.deposit || 0, 'דמי ניהול %': a.fee || 0, 'נזילות': a.liquidity})));
    add('היסטוריית הון', all.snapshots.map(s => ({'חודש': s.id, 'סך ההון': s.total, 'הפקדות': s.deposits || 0, ...Object.fromEntries((s.byType || []).map(x => [x.name, x.value]))})));
    const out = XLSX.write(wb, {type: 'array', bookType: 'xlsx'});
    await offer(`pinkas-${today()}.xlsx`, new Uint8Array(out));
  } catch (e) { console.error(e); toast('הייצוא נכשל'); }
}
async function doRestore() {
  const R = S.restore; if (!R || R.busy) return;
  R.busy = true; render();
  let fail = 0;
  for (let i = 0; i < R.docs.length; i += 8) await Promise.all(R.docs.slice(i, i + 8).map(async ([p, d]) => { try { await withRetry(() => S.db.doc(p).set(d)); } catch { fail++; } }));
  S.restore = null; render();
  toast(fail ? `שוחזרו ${R.count - fail} רשומות, ${fail} נכשלו` : `שוחזרו ${R.count} רשומות`);
}

/* ---------- toast & theme ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.firstElementChild.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.view === 'history' && render());
new MutationObserver(() => S.view === 'history' && render()).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
const netState = () => { const el = $('#netState'); if (el) el.hidden = navigator.onLine; };
window.addEventListener('online', netState); window.addEventListener('offline', netState); netState();
boot();
</script>
